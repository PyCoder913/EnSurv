version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    pre_install:
      - '"$READTHEDOCS_VIRTUALENV_PATH/bin/python" -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"'

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
        - workflow
